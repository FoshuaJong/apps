<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Overdrive: Pong</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #050505;
            border: 2px solid #333;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            cursor: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 800px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        #instructions {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
            text-align: center;
        }
        .highlight { color: #0ff; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="score-player">Player: 0</div>
        <div id="score-ai">AI: 0</div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <div id="instructions">
        Mouse to move. Click to start.<br>
        <span style="color: #ff00ff">Pink</span>: Split | 
        <span style="color: #00ff00">Green</span>: Reverse | 
        <span style="color: #ffff00">Yellow</span>: Gravity | 
        <span style="color: #ff0000">Red</span>: Lethal Laser | 
        <span style="color: #00ffff">Cyan</span>: Shrink Zone
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scorePlayerEl = document.getElementById('score-player');
    const scoreAiEl = document.getElementById('score-ai');

    // Audio Context (Synthesized Sounds)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;

    function initAudio() {
        if (!actx) actx = new AudioContext();
        if (actx.state === 'suspended') actx.resume();
    }

    function playSound(type) {
        if (!actx) return;
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.connect(gain);
        gain.connect(actx.destination);

        const now = actx.currentTime;
        if (type === 'hit') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'score') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.5);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'powerup') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.3);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'laser') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'explosion') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        }
    }

    // Game State
    let gameActive = false;
    let scorePlayer = 0;
    let scoreAi = 0;
    let globalGravity = 0;
    let activeShields = [];
    
    // Entities
    const paddleWidth = 10, paddleHeight = 80;
    const player = { x: 20, y: canvas.height/2 - paddleHeight/2, w: paddleWidth, h: paddleHeight, color: '#0ff', targetY: canvas.height/2 };
    const ai = { x: canvas.width - 30, y: canvas.height/2 - paddleHeight/2, w: paddleWidth, h: paddleHeight, color: '#f0f', speed: 4, stunned: 0 };
    
    let balls = [];
    let particles = [];
    let powerups = [];
    let projectiles = [];

    const powerupTypes = [
        { type: 'split', color: '#ff00ff' },
        { type: 'reverse', color: '#00ff00' },
        { type: 'gravity', color: '#ffff00' },
        { type: 'laser', color: '#ff0000' },
        { type: 'shrink', color: '#00ffff' }
    ];

    function createBall(x, y, dx, dy) {
        return { x, y, r: 6, dx, dy, color: '#fff', trail: [] };
    }

    function resetGame() {
        balls = [createBall(canvas.width/2, canvas.height/2, 5 * (Math.random() > 0.5 ? 1 : -1), (Math.random() * 4 - 2))];
        powerups = [];
        projectiles = [];
        globalGravity = 0;
        activeShields = [];
        ai.stunned = 0;
    }

    function createParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x, y,
                dx: (Math.random() - 0.5) * 8,
                dy: (Math.random() - 0.5) * 8,
                life: 1,
                color
            });
        }
    }

    function fireLaser() {
        projectiles.push({ x: player.x + player.w, y: player.y + player.h/2, dx: 15, w: 20, h: 4, color: '#f00' });
        playSound('laser');
    }

    function applyPowerup(type) {
        playSound('powerup');
        createParticles(canvas.width/2, canvas.height/2, '#fff', 30);

        switch(type) {
            case 'split':
                let newBalls = [];
                balls.forEach(b => {
                    newBalls.push(createBall(b.x, b.y, b.dx, -b.dy));
                });
                balls.push(...newBalls);
                break;
            case 'reverse':
                balls.forEach(b => { b.dx *= -1; b.dy *= -1; });
                break;
            case 'gravity':
                globalGravity = 0.2;
                setTimeout(() => globalGravity = 0, 8000);
                break;
            case 'laser':
                fireLaser();
                break;
            case 'shrink':
                // Shrink the vulnerable score zone by placing shields top and bottom
                activeShields = [
                    { x: 0, y: 0, w: 40, h: canvas.height * 0.3, life: 600 },
                    { x: 0, y: canvas.height * 0.7, w: 40, h: canvas.height * 0.3, life: 600 }
                ];
                break;
        }
    }

    // Input handling
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        player.targetY = e.clientY - rect.top - player.h/2;
    });

    canvas.addEventListener('mousedown', () => {
        initAudio();
        if (!gameActive) {
            gameActive = true;
            resetGame();
        }
    });

    // Main Update Loop
    function update() {
        if (!gameActive) return;

        // Player smoothing
        player.y += (player.targetY - player.y) * 0.2;
        player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));

        // AI Logic
        if (ai.stunned > 0) {
            ai.stunned--;
        } else {
            let targetBall = balls[0];
            balls.forEach(b => {
                if (b.dx > 0 && b.x > (targetBall ? targetBall.x : 0)) targetBall = b;
            });

            if (targetBall) {
                let aiTarget = targetBall.y - ai.h/2;
                // Add imperfection
                if (Math.abs(aiTarget - ai.y) > 5) {
                    ai.y += (aiTarget > ai.y ? ai.speed : -ai.speed);
                }
            }
            ai.y = Math.max(0, Math.min(canvas.height - ai.h, ai.y));
        }

        // Shields update
        activeShields.forEach(s => s.life--);
        activeShields = activeShields.filter(s => s.life > 0);

        // Powerup Spawning
        if (Math.random() < 0.002 && powerups.length < 2) {
            const pType = powerupTypes[Math.floor(Math.random() * powerupTypes.length)];
            powerups.push({
                x: canvas.width/2 + (Math.random() * 200 - 100),
                y: Math.random() * (canvas.height - 40) + 20,
                r: 12,
                ...pType,
                time: 0
            });
        }

        // Projectiles Update
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            p.x += p.dx;
            
            // Hit AI
            if (p.x < ai.x + ai.w && p.x + p.w > ai.x && p.y < ai.y + ai.h && p.y + p.h > ai.y) {
                ai.stunned = 180; // 3 seconds at 60fps
                createParticles(ai.x, ai.y + ai.h/2, '#f0f', 50);
                playSound('explosion');
                projectiles.splice(i, 1);
                continue;
            }
            if (p.x > canvas.width) projectiles.splice(i, 1);
        }

        // Balls Update
        for (let i = balls.length - 1; i >= 0; i--) {
            let b = balls[i];
            
            // Gravity
            if (globalGravity > 0) b.dy += globalGravity;

            b.x += b.dx;
            b.y += b.dy;

            // Trail
            b.trail.push({x: b.x, y: b.y});
            if (b.trail.length > 10) b.trail.shift();

            // Wall collisions (top/bottom)
            if (b.y - b.r < 0) { b.y = b.r; b.dy *= -1; playSound('hit'); }
            if (b.y + b.r > canvas.height) { b.y = canvas.height - b.r; b.dy *= -1; playSound('hit'); }

            // Paddle Collisions
            let hitPaddle = null;
            if (b.dx < 0 && b.x - b.r < player.x + player.w && b.x + b.r > player.x && b.y > player.y && b.y < player.y + player.h) {
                hitPaddle = player;
                b.x = player.x + player.w + b.r;
            } else if (b.dx > 0 && b.x + b.r > ai.x && b.x - b.r < ai.x + ai.w && b.y > ai.y && b.y < ai.y + ai.h) {
                hitPaddle = ai;
                b.x = ai.x - b.r;
            }

            if (hitPaddle) {
                b.dx *= -1.05; // Speed up slightly
                // Adjust angle based on where it hit the paddle
                let hitPoint = (b.y - (hitPaddle.y + hitPaddle.h/2)) / (hitPaddle.h/2);
                b.dy = hitPoint * 5; 
                playSound('hit');
                createParticles(b.x, b.y, hitPaddle.color, 15);
            }

            // Shield Collisions (Player Side)
            activeShields.forEach(s => {
                if (b.x - b.r < s.x + s.w && b.y > s.y && b.y < s.y + s.h) {
                    b.x = s.x + s.w + b.r;
                    b.dx *= -1;
                    playSound('hit');
                    createParticles(b.x, b.y, '#0ff', 10);
                }
            });

            // Powerup Collection
            for (let j = powerups.length - 1; j >= 0; j--) {
                let p = powerups[j];
                let dist = Math.hypot(b.x - p.x, b.y - p.y);
                if (dist < b.r + p.r) {
                    applyPowerup(p.type);
                    powerups.splice(j, 1);
                }
            }

            // Scoring
            if (b.x < 0) {
                scoreAi++;
                scoreAiEl.innerText = `AI: ${scoreAi}`;
                scoreAiEl.classList.add('highlight');
                setTimeout(() => scoreAiEl.classList.remove('highlight'), 300);
                balls.splice(i, 1);
                playSound('score');
                createParticles(0, b.y, '#f00', 40);
            } else if (b.x > canvas.width) {
                scorePlayer++;
                scorePlayerEl.innerText = `Player: ${scorePlayer}`;
                scorePlayerEl.classList.add('highlight');
                setTimeout(() => scorePlayerEl.classList.remove('highlight'), 300);
                balls.splice(i, 1);
                playSound('score');
                createParticles(canvas.width, b.y, '#0ff', 40);
            }
        }

        // Respawn ball if all are gone
        if (balls.length === 0) {
            balls.push(createBall(canvas.width/2, canvas.height/2, 5 * (Math.random() > 0.5 ? 1 : -1), (Math.random() * 4 - 2)));
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.dx;
            p.y += p.dy;
            p.life -= 0.02;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    // Rendering
    function draw() {
        // Clear with slight opacity for motion blur effect
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Center dashed line
        ctx.setLineDash([10, 15]);
        ctx.beginPath();
        ctx.moveTo(canvas.width/2, 0);
        ctx.lineTo(canvas.width/2, canvas.height);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.stroke();
        ctx.setLineDash([]);

        if (!gameActive) {
            ctx.fillStyle = '#fff';
            ctx.font = '30px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('CLICK TO INITIALIZE', canvas.width/2, canvas.height/2);
            requestAnimationFrame(draw);
            return;
        }

        // Draw Shields
        ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#0ff';
        activeShields.forEach(s => {
            ctx.fillRect(s.x, s.y, s.w, s.h);
        });

        // Draw Paddles
        ctx.shadowBlur = 15;
        
        ctx.shadowColor = player.color;
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.w, player.h);

        ctx.shadowColor = ai.color;
        ctx.fillStyle = ai.stunned > 0 ? '#555' : ai.color;
        ctx.fillRect(ai.x, ai.y, ai.w, ai.h);
        
        // Stunned indicator
        if (ai.stunned > 0) {
            ctx.fillStyle = '#f00';
            ctx.font = '12px Courier New';
            ctx.fillText('ERR', ai.x + ai.w/2, ai.y - 10);
        }

        // Draw Powerups
        powerups.forEach(p => {
            p.time += 0.1;
            ctx.shadowColor = p.color;
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r + Math.sin(p.time) * 2, 0, Math.PI * 2);
            ctx.stroke();
            
            // Inner core
            ctx.fillStyle = p.color;
            ctx.globalAlpha = 0.5;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });

        // Draw Projectiles
        ctx.shadowColor = '#f00';
        ctx.fillStyle = '#f00';
        projectiles.forEach(p => {
            ctx.fillRect(p.x, p.y, p.w, p.h);
        });

        // Draw Balls
        ctx.shadowColor = '#fff';
        balls.forEach(b => {
            // Trail
            ctx.beginPath();
            if(b.trail.length > 0) {
                ctx.moveTo(b.trail[0].x, b.trail[0].y);
                for(let i=1; i<b.trail.length; i++) {
                    ctx.lineTo(b.trail[i].x, b.trail[i].y);
                }
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = b.r * 1.5;
                ctx.stroke();
            }

            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.fill();
        });

        // Draw Particles
        particles.forEach(p => {
            ctx.shadowBlur = 5;
            ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0; // reset

        // Gravity Indicator
        if (globalGravity > 0) {
            ctx.fillStyle = 'rgba(255, 255, 0, 0.2)';
            ctx.fillRect(0, canvas.height - 10, canvas.width, 10);
        }

        requestAnimationFrame(draw);
    }

    // Start loop
    setInterval(update, 1000/60); // 60 FPS Logic
    draw(); // Render Loop

</script>
</body>
</html>
