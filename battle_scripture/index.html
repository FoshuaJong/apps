<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Scripture — Lumineth Realm-Lords</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg:      #0E1318;
    --surface: #161D27;
    --raised:  #1E2735;
    --border:  #2A3448;
    --border2: #374660;
    --txt:     #D8E4F0;
    --txt2:    #7A8FA8;
    --txt3:    #47586E;
    --lb:      #4A9FDA;
    --lb-dim:  rgba(74,159,218,0.15);
    --lb-text: #4A9FDA;
    --lb-hi:   #6AB6E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 0 16px;
  }
  .scroll-content {
    flex: 1;
    padding: 16px 14px 16px;
  }
  .bottom-section {
    position: sticky;
    bottom: 0;
    z-index: 1;
    flex-shrink: 0;
    padding: 0 14px 16px;
    background: var(--bg);
    border-top: 1px solid var(--border);
  }

  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .header-title { font-size: 20px; font-weight: 600; color: var(--txt); letter-spacing: 0.02em; font-family: Georgia, serif; }
  .header-sub { font-size: 10px; color: var(--txt3); letter-spacing: 0.1em; margin-top: 2px; text-transform: uppercase; }
  .round-badge { font-size: 13px; font-weight: 600; color: var(--lb-text); background: var(--lb-dim); border: 1px solid rgba(74,159,218,0.3); border-radius: 8px; padding: 5px 13px; white-space: nowrap; }
  .reset-btn { background: none; border: none; color: var(--txt3); font-size: 12px; cursor: pointer; padding: 4px 4px; margin-top: 6px; display: flex; align-items: center; gap: 3px; }
  .reset-btn:hover { color: var(--txt2); }

  .scripture-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 46px; }
  .scripture-label { font-size: 10px; color: var(--txt3); letter-spacing: 0.1em; text-transform: uppercase; margin-right: 2px; flex-shrink: 0; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
  .chip-normal { background: var(--raised); border: 1px solid var(--border2); color: var(--txt); }
  .chip-new { background: var(--lb-dim); border: 1px solid rgba(74,159,218,0.45); color: var(--lb-text); }
  .chip-empty { font-size: 12px; color: var(--txt3); font-style: italic; }
  .zenith-chip { margin-left: auto; background: var(--lb-dim); border: 1px solid rgba(74,159,218,0.3); color: var(--lb-text); font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }

  .section-label { font-size: 10px; font-weight: 600; color: var(--txt3); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }

  .rune-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-bottom: 12px; }
  .rune-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 4px 10px; cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent; transition: border-color 0.12s; }
  .rune-card:hover { border-color: var(--border2); }
  .rune-card.selected { background: var(--lb-dim); border: 2px solid var(--lb); }
  .rune-svg-wrap { display: flex; justify-content: center; align-items: center; margin-bottom: 8px; height: 28px; }
  .rune-card svg { color: var(--txt3); transition: color 0.12s; }
  .rune-card.selected svg { color: var(--lb-text); }
  .rune-card-name { font-size: 11px; font-weight: 600; color: var(--txt2); font-family: Georgia, serif; line-height: 1.2; }
  .rune-card.selected .rune-card-name { color: var(--txt); }
  .rune-card-sub { font-size: 9px; color: var(--txt3); margin-top: 2px; line-height: 1.3; }
  .rune-card.selected .rune-card-sub { color: var(--lb-text); opacity: 0.8; }
  .rune-card-meta { font-size: 9px; color: var(--txt3); margin-top: 4px; }
  .syn-count { display: inline-flex; align-items: center; gap: 2px; font-size: 9px; color: var(--lb-text); background: rgba(74,159,218,0.1); border-radius: 4px; padding: 1px 5px; margin-top: 4px; }

  .preview-box { background: rgba(36, 47, 62, 0.95); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .preview-heading { font-size: 11px; font-weight: 600; color: #FFFFFF; font-family: Georgia, serif; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .preview-base { font-size: 13px; color: var(--txt); line-height: 1.55; margin-bottom: 10px; }
  .syn-header { font-size: 9px; font-weight: 600; color: var(--txt3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .syn-header.active { color: var(--lb-text); }
  .syn-header.future { color: var(--txt3); }
  .syn-row { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); margin-bottom: 5px; }
  .syn-row.active { background: rgba(74,159,218,0.1); border-color: rgba(74,159,218,0.25); box-shadow: inset 0 0 0 1px rgba(74,159,218,0.08); }
  .syn-row.future { background: rgba(255,255,255,0.02); border-color: rgba(255,255,255,0.06); }
  .syn-row-label { font-size: 10px; font-weight: 600; color: var(--lb-text); font-family: Georgia, serif; margin-bottom: 3px; }
  .syn-row.future .syn-row-label { color: var(--txt3); }
  .syn-row-text { font-size: 12px; color: var(--txt); line-height: 1.4; }
  .syn-row.future .syn-row-text { color: var(--txt3); }

  .confirm-btn { width: 100%; background: var(--lb); color: #fff; border: none; border-radius: 10px; padding: 13px 0; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .confirm-btn:disabled { background: var(--surface); color: var(--txt3); border: 1px solid var(--border); cursor: default; }
  .confirm-btn:not(:disabled):active { opacity: 0.85; }

  .effect-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 7px; }
  .effect-row.enhanced { margin-left: 8px; background: rgba(74,159,218,0.07); border: 1px solid rgba(74,159,218,0.22); border-left: 4px solid var(--lb); }
  .effect-icon { flex-shrink: 0; margin-top: 2px; display: flex; align-items: flex-start; }
  .effect-icon svg { color: var(--txt3); }
  .effect-row.enhanced .effect-icon svg { color: var(--lb-text); }
  .effect-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .effect-name { font-size: 11px; font-weight: 600; color: var(--txt2); font-family: Georgia, serif; }
  .effect-row.enhanced .effect-name { color: var(--lb-text); }
  .badge { font-size: 9px; font-weight: 600; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .badge-new { background: var(--lb); color: #fff; }
  .badge-enh { background: rgba(74,159,218,0.15); color: var(--lb-text); border: 1px solid rgba(74,159,218,0.3); }
  .badge-dim { background: var(--raised); color: var(--txt3); border: 1px solid var(--border); }
  .effect-text { font-size: 13px; color: var(--txt); line-height: 1.55; }
  .effect-dimmed { opacity: 0.4; }
  .effect-dimmed .effect-text { color: var(--txt2); }
  .multi-note { font-size: 10px; color: var(--txt3); margin-top: 2px; }

  .next-btn { width: 100%; background: var(--lb); color: #fff; border: none; border-radius: 10px; padding: 13px 0; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }
  .next-btn:active { opacity: 0.85; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ── Rune SVG path data (40×40 viewBox, stroke-based) ─────────────────────── */
const RUNE_PATHS = {
  /* Varinor — Strength: central spine, upward arrowhead, crossbar, splayed base */
  varinor: `
    <path d="M20 5 L20 37"/>
    <path d="M11 14 L20 5 L29 14"/>
    <path d="M10 23 L30 23"/>
    <path d="M11 37 L20 30 L29 37"/>`,

  /* Alaithi — Mountain: triangle silhouette with interior contour lines */
  alaithi: `
    <path d="M4 36 L20 7 L36 36 Z"/>
    <path d="M12 27 L28 27"/>
    <path d="M16 20 L24 20"/>`,

  /* Ydriliqi — River: three undulating horizontal waves */
  ydriliqi: `
    <path d="M5 13 C11 9 16 18 22 13 C28 8 33 17 38 13"/>
    <path d="M5 21 C11 17 16 26 22 21 C28 16 33 25 38 21"/>
    <path d="M5 29 C11 25 16 34 22 29 C28 24 33 33 38 29"/>`,

  /* Oreali — Wind: three sweeping parallel arcs with diminishing length */
  oreali: `
    <path d="M6 32 C11 19 23 10 35 10"/>
    <path d="M6 37 C11 24 23 15 35 15"/>
    <path d="M11 27 C15 18 23 13 34 13"/>
    <path d="M31 7 L35 10 L31 13"/>`,

  /* Thalari — Zenith: central circle with eight radiating rays */
  thalari: `
    <circle cx="20" cy="20" r="5" fill="currentColor"/>
    <path d="M20 6 L20 13"/>
    <path d="M20 27 L20 34"/>
    <path d="M6 20 L13 20"/>
    <path d="M27 20 L34 20"/>
    <path d="M29.2 10.8 L24.5 15.5"/>
    <path d="M10.8 10.8 L15.5 15.5"/>
    <path d="M29.2 29.2 L24.5 24.5"/>
    <path d="M10.8 29.2 L15.5 24.5"/>`
};

const SVG_ATTRS = `fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"`;

function runeSvg(id, size, sw = 2.2) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" ${SVG_ATTRS} stroke-width="${sw}" aria-hidden="true">${RUNE_PATHS[id]}</svg>`;
}

/* ── Rune data ─────────────────────────────────────────────────────────────── */
const ORDER = ['varinor','alaithi','ydriliqi','oreali','thalari'];
const RUNES = {
  varinor:  {
    name:'Varinor', sub:'Strength', color:'#C8A96E',
    base:'Pick up to 2 friendly units per instance.<br>Add 1 to run rolls and charge rolls for each target.',
    enhanced:[
      {req:'ydriliqi', rn:'Ydriliqi', text:'+1 to wound rolls for combat attacks made by targets.'},
      {req:'oreali',   rn:'Oreali',   text:'Targets may use SHOOT and/or CHARGE even if they used RETREAT this turn.'}
    ]
  },
  alaithi:  {
    name:'Alaithi', sub:'Mountain', color:'#9EB8CC',
    base:"Pick up to 2 friendly units per instance.<br>Each target has WARD (5+).",
    enhanced:[
      {req:'varinor',  rn:'Varinor',  text:"Targets' melee weapons gain Anti-charge (+1 Rend)."},
      {req:'ydriliqi', rn:'Ydriliqi', text:'Subtract 1 from wound rolls for attacks by enemy units in combat with targets.'}
    ]
  },
  ydriliqi: {
    name:'Ydriliqi', sub:'River', color:'#6AADCC',
    base:'Pick up to 2 friendly units per instance.<br>Subtract 2 from enemy charge rolls within 12" of any target.',
    enhanced:[
      {req:'alaithi', rn:'Alaithi', text:'Ignore negative modifiers to hit and wound rolls for attacks made by targets.'},
      {req:'oreali',  rn:'Oreali',  text:'Each target may immediately move up to 3", passing through enemy combat ranges; may end in combat.'}
    ]
  },
  oreali:   {
    name:'Oreali', sub:'Wind', color:'#A8CCAA',
    base:'Pick up to 2 friendly units per instance.<br>Subtract 1 from hit rolls for attacks by enemy units in combat with targets.',
    enhanced:[
      {req:'varinor', rn:'Varinor', text:"+4\" to each target's Move characteristic."},
      {req:'alaithi', rn:'Alaithi', text:"+5 to each target's control score."}
    ]
  },
  thalari:  {
    name:'Thalari', sub:'Zenith', color:'#EAD07A',
    base:'Add 2 to casting rolls for all friendly LUMINETH REALM-LORDS units.',
    enhanced:[],
    zenith:'+4" Move for all friendly units, and attacks score critical hits on unmodified hit rolls of 5+.'
  }
};

/* ── State ─────────────────────────────────────────────────────────────────── */
const MAX_ROUNDS = 5;
let S = { round:1, counts:{varinor:0,alaithi:0,ydriliqi:0,oreali:0,thalari:0}, sel:null, phase:'selecting' };

function dep(id){ return S.counts[id] > 0; }
function uniq(){ return ORDER.filter(dep).length; }
function zenithActive(){ return S.phase === 'active' && S.sel === 'thalari' && uniq() >= 4; }
function thalariZenithPreview(id){ return id === 'thalari' && !dep('thalari') && uniq() === 3; }

function synergiesFor(id) {
  const s = [];
  RUNES[id].enhanced.forEach(e => {
    if (dep(e.req)) s.push({runeId:id, rn:e.rn, text:e.text});
  });
  return s;
}

function futureSynergiesFor(id) {
  const s = [];
  ORDER.forEach(o => {
    if (o === id) return;
    RUNES[o].enhanced.forEach(e => {
      if (e.req === id) s.push({runeId:o, rn:RUNES[id].name, text:e.text});
    });
  });
  return s;
}

function potentialSynCount(id) {
  let n = 0;
  RUNES[id].enhanced.forEach(e => { if (dep(e.req)) n++; });
  return n;
}

function allEffects() {
  const rows = [];
  if (!S.sel) return rows;

  rows.push({
    runeId: S.sel,
    type: 'base',
    isNew: true,
    count: S.counts[S.sel],
    text: RUNES[S.sel].base
  });

  RUNES[S.sel].enhanced.forEach(e => {
    if (dep(e.req)) rows.push({runeId:S.sel, type:'enhanced', isNew:false, rn:e.rn, text:e.text});
  });

  return rows;
}

function dispatch(action, payload) {
  if (action==='select')  { S.sel = payload; }
  if (action==='confirm') { if (!S.sel) return; S.counts[S.sel]++; S.phase='active'; }
  if (action==='next')    { if (S.round < MAX_ROUNDS) S.round++; S.sel=null; S.phase='selecting'; }
  if (action==='reset')   { S = {round:1,counts:{varinor:0,alaithi:0,ydriliqi:0,oreali:0,thalari:0},sel:null,phase:'selecting'}; }
  render();
}

/* ── Render ─────────────────────────────────────────────────────────────────── */
function render() {
  const uq = uniq(), za = zenithActive();
  const depList = ORDER.filter(dep);

  /* Scripture chips */
  let chips = depList.length === 0
    ? `<span class="chip-empty">No runes depicted yet</span>`
    : depList.map(id => {
        const isNew = id===S.sel && S.phase==='active';
        return `<span class="chip ${isNew?'chip-new':'chip-normal'}">
          ${runeSvg(id, 13, 2.5)}
          ${RUNES[id].name}
          ${S.counts[id]>1 ? `<span style="font-size:10px;opacity:0.6;">×${S.counts[id]}</span>` : ''}
          ${isNew ? `<span class="badge badge-new" style="margin-left:1px;">active</span>` : ''}
        </span>`;
      }).join('');

  let zenithChip = za ? `<span class="zenith-chip">${runeSvg('thalari',12,2.5)} Zenith</span>` : '';

  /* ── Selecting phase ── */
  let previewHTML = '';
  let stickyHTML = '';
  let activeHTML = '';
  if (S.phase === 'selecting') {
    const cards = ORDER.map(id => {
      const r = RUNES[id];
      const isSel = S.sel === id;
      const sc = potentialSynCount(id);
      const unq = uniq();
      const showThalariPreview = thalariZenithPreview(id);
      const previewLabel = showThalariPreview ? `${unq}/4` : sc > 0 ? String(sc) : '';
      const hasDep = dep(id);
      const meta = hasDep
        ? `<div class="rune-card-meta">×${S.counts[id]}${sc ? ` <span class="syn-count">+${sc}</span>` : ''}</div>`
        : previewLabel
          ? `<div class="syn-count"><i class="ti ti-bolt" style="font-size:8px;" aria-hidden="true"></i>${previewLabel}</div>`
          : '';
      return `<div class="rune-card${isSel?' selected':''}" onclick="dispatch('select','${id}')">
        <div class="rune-svg-wrap">${runeSvg(id, 26, 2)}</div>
        <div class="rune-card-name">${r.name}</div>
        <div class="rune-card-sub">${r.sub}</div>
        ${meta}
      </div>`;
    }).join('');

    let preview = '';
    if (S.sel) {
      const r = RUNES[S.sel];
      const syns = synergiesFor(S.sel);
      const futureSyns = futureSynergiesFor(S.sel);
      let synRows = '';
      if (syns.length) {
        synRows = `<div class="syn-header active"><i class="ti ti-bolt" style="font-size:9px;margin-right:3px;" aria-hidden="true"></i>Enhanced effects</div>`
          + syns.map(s => `<div class="syn-row active">
              <div style=\"flex-shrink:0;padding-top:1px;display:flex;flex-direction:column;gap:2px;\">
                ${runeSvg(s.runeId, 12, 2)}
                ${runeSvg(Object.keys(RUNES).find(id => RUNES[id].name === s.rn), 9, 1.8)}
              </div>
              <div>
                <div class="syn-row-label">${RUNES[s.runeId].name} + ${s.rn}</div>
                <div class="syn-row-text">${s.text}</div>
              </div>
            </div>`).join('');
      }
      let futureRows = '';
      if (futureSyns.length && !dep(S.sel)) {
        futureRows = `<div class="syn-header future"><i class="ti ti-bolt" style="font-size:9px;margin-right:3px;" aria-hidden="true"></i>Future enhancements enabled</div>`
          + futureSyns.map(s => `<div class="syn-row future">
              <div style=\"flex-shrink:0;padding-top:1px;display:flex;flex-direction:column;gap:2px;\">
                ${runeSvg(s.runeId, 12, 2)}
                ${runeSvg(Object.keys(RUNES).find(id => RUNES[id].name === s.rn), 9, 1.8)}
              </div>
              <div>
                <div class="syn-row-label">${RUNES[s.runeId].name} + ${s.rn}</div>
                <div class="syn-row-text">${s.text}</div>
              </div>
            </div>`).join('');
      }
      const zenithPreview = thalariZenithPreview(S.sel)
        ? `<div class="syn-header"><i class="ti ti-bolt" style="font-size:9px;margin-right:3px;" aria-hidden="true"></i>Enhanced Effect</div>
           <div class="syn-row">
             <div style="flex-shrink:0;padding-top:1px;">${runeSvg('thalari', 15, 2.2)}</div>
             <div>
               <div class="syn-row-label">Thalari will be the 4th unique rune</div>
               <div class="syn-row-text">+4" Move for all friendly units, and attacks score critical hits on unmodified hit rolls of 5+</div>
             </div>
           </div>`
        : '';
      preview = `<div class="preview-box">
        <div class="preview-heading">
          ${runeSvg(S.sel, 16, 2)}
          ${r.name} | ${r.sub}
        </div>
        <div class="preview-base">${r.base}</div>
        ${synRows}
        ${futureRows}
        ${zenithPreview}
      </div>`;
    }

    const btnLabel = S.sel
      ? `${runeSvg(S.sel, 16, 2.2)} Depict ${RUNES[S.sel].name}`
      : 'Select a rune to continue';

    previewHTML = preview;
    stickyHTML = `
      <div class="section-label">Depict a rune this round</div>
      <div class="rune-grid">${cards}</div>
      <button class="confirm-btn" ${!S.sel?'disabled':''} onclick="dispatch('confirm')">${btnLabel}</button>`;
  }

  /* ── Active phase ── */
  if (S.phase === 'active') {
    const rows = allEffects();
    let rowsHTML = rows.map(e => {
      const isEnh = e.type === 'enhanced';
      const enhBadge = isEnh ? `<span class="badge badge-enh">enhanced</span>` : '';
      const multi = e.count>1 && e.type==='base' && e.runeId !== 'thalari'
        ? `<div class="multi-note">${e.count} instances active • affects up to ${e.count*2} units total</div>` : '';
      const iconHtml = isEnh
        ? `<div style="display:flex;flex-direction:column;gap:2px;">
            ${runeSvg(e.runeId, 14, 2)}
            ${runeSvg(Object.keys(RUNES).find(id => RUNES[id].name === e.rn), 10, 1.8)}
          </div>`
        : `${runeSvg(e.runeId, 17, 2)}`;
      return `<div class="effect-row${isEnh?' enhanced':''}">
        <div class="effect-icon">${iconHtml}</div>
        <div style="flex:1;min-width:0;">
          <div class="effect-meta">
            <span class="effect-name">${RUNES[e.runeId].name}${isEnh?' + '+e.rn:''}</span>
            ${enhBadge}
          </div>
          <div class="effect-text">${e.text}</div>
          ${multi}
        </div>
      </div>`;
    }).join('');

    if (za) {
      rowsHTML += `<div class="effect-row enhanced">
        <div class="effect-icon">${runeSvg('thalari', 17, 2)}</div>
        <div style="flex:1;min-width:0;">
          <div class="effect-meta">
            <span class="effect-name">Thalari — Zenith Bonus</span>
            <span class="badge badge-enh">${uq}/4 runes</span>
          </div>
          <div class="effect-text">${RUNES.thalari.zenith}</div>
        </div>
      </div>`;
    }

    if (!rows.length) {
      rowsHTML = `<p style="color:var(--txt3);font-size:13px;">No effects active.</p>`;
    }

    activeHTML = `<div class="section-label">Active effects this round</div>
      ${rowsHTML}`;

    if (S.round < MAX_ROUNDS) {
      stickyHTML = `<button class="next-btn" onclick="dispatch('next')">
        Advance to Round ${S.round+1}
        <i class="ti ti-arrow-right" style="font-size:15px;" aria-hidden="true"></i>
      </button>`;
    } else {
      stickyHTML = `<div class="multi-note">Maximum of ${MAX_ROUNDS} rounds reached.</div>`;
    }
  }

  document.getElementById('app').innerHTML = `
    <div class="scroll-content">
      <div class="header">
        <div>
          <div class="header-title">Battle Scripture</div>
          <div class="header-sub">Lumineth Realm-Lords</div>

  `;
