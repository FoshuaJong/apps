<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0910">
  <title>Shadow Throne Pack Opener</title>
  <meta name="description" content="Tear open Flesh and Blood booster packs, boxes and cases of Usurp the Shadow Throne. Real slot layout, holo foils, a binder that remembers your pulls, and luck stats.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='3' width='18' height='26' rx='2' fill='%23d23a4e'/%3E%3Cpath d='M11 12l5-5 5 5-5 9z' fill='%23f0c35a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-binder" viewBox="0 0 24 24"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3z M8 3v18 M11 8h5 M11 11h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-stats" viewBox="0 0 24 24"><path d="M4 20h16 M7 17V11 M12 17V6 M17 17v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7 M3 4v4h4 M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-odds" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="15" cy="15" r="1.4" fill="currentColor"/><circle cx="15" cy="9" r="1.4" fill="currentColor"/><circle cx="9" cy="15" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z M16 9a4 4 0 0 1 0 6 M18.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z M16 9l5 6 M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v3 M12 18.5v3 M2.5 12h3 M18.5 12h3 M5.3 5.3l2.1 2.1 M16.6 16.6l2.1 2.1 M5.3 18.7l2.1-2.1 M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z M7 6H4v1a3 3 0 0 0 3 3 M17 6h3v1a3 3 0 0 1-3 3 M12 14v3 M8 20h8 M9 17h6v3H9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12 M7 8l5-5 5 5 M5 13v6h14v-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12 M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-throne" viewBox="0 0 64 80"><path d="M18 40V14l4-8 4 8v-4l6-8 6 8v4l4-8 4 8v26z M26 38V23q6-9 12 0v15z M10 31h8v9h-8z M46 31h8v9h-8z M11 40h42v7H11z M14 47h6v29h-6z M44 47h6v29h-6z M20 61h24v4H20z" fill="currentColor" fill-rule="evenodd"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <a class="brand" href="./" aria-label="Shadow Throne Pack Opener, start over">
    <svg class="brand-mark" aria-hidden="true"><use href="#i-throne"/></svg>
    <span class="brand-text"><b>Shadow Throne</b><small>Pack opener</small></span>
  </a>
  <nav class="modes" role="tablist" aria-label="What to open">
    <button role="tab" data-mode="pack" aria-selected="true">Pack</button>
    <button role="tab" data-mode="box" aria-selected="false">Box <small>24</small></button>
    <button role="tab" data-mode="case" aria-selected="false">Case <small>4 boxes</small></button>
    <button role="tab" data-mode="armory" aria-selected="false" hidden>Armory <small>Malice</small></button>
  </nav>
  <div class="top-tools">
    <div class="wallet" id="wallet" aria-live="off">
      <span class="w-pack" aria-hidden="true"></span>
      <span class="w-text"><b class="w-count">24</b><small>/96 packs</small></span>
      <span class="w-next">+1 in 5:00</span>
      <span class="w-bar"><i></i></span>
    </div>
    <div class="seedbox" title="A seed pins the result: the same seed always opens the same pack, box or case.">
      <label for="seed">Seed</label>
      <input id="seed" type="text" placeholder="random" autocomplete="off" spellcheck="false">
      <button class="icon-btn small" id="rollSeed" aria-label="Clear seed (use random)"><svg><use href="#i-dice"/></svg></button>
    </div>
    <button class="icon-btn" data-drawer="binder" aria-label="Binder (C)"><svg><use href="#i-binder"/></svg><span class="lbl">Binder</span><span class="pip" id="binderPip" hidden></span></button>
    <button class="icon-btn" data-drawer="stats" aria-label="Stats (S)"><svg><use href="#i-stats"/></svg><span class="lbl">Stats</span></button>
    <button class="icon-btn" data-drawer="history" aria-label="History (H)"><svg><use href="#i-history"/></svg><span class="lbl">History</span></button>
    <button class="icon-btn" data-drawer="ach" aria-label="Achievements (T)"><svg><use href="#i-trophy"/></svg><span class="lbl">Achievements</span><span class="pip" id="achPip" hidden></span></button>
    <button class="icon-btn" data-drawer="odds" aria-label="Odds"><svg><use href="#i-odds"/></svg><span class="lbl">Odds</span></button>
    <button class="icon-btn" id="muteBtn" aria-label="Sound on (M)"><svg><use href="#i-sound"/></svg></button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings" aria-expanded="false"><svg><use href="#i-gear"/></svg></button>
  </div>
</header>

<div class="settings-pop" id="settings" hidden></div>

<main class="stage" id="stage">
  <div class="info" id="info"></div>
  <div class="table" id="table"><div class="loading"><div class="spinner"></div><p id="loadMsg">Shuffling the set…</p></div></div>
  <p class="hint" id="hint"></p>
  <section class="spread" id="spread" aria-label="Cards in this pack"></section>
</main>

<div class="spot" id="spot" hidden></div>

<div class="drawer-scrim" id="drawerScrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-labelledby="drawerTitle" role="dialog" aria-modal="true">
  <header class="drawer-head"><h2 id="drawerTitle"></h2><button class="icon-btn" id="drawerClose" aria-label="Close"><svg><use href="#i-close"/></svg></button></header>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mName"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="sr-only" id="live" aria-live="assertive"></div>

<footer class="foot">
  <p>Fan-made simulator, not affiliated with or endorsed by Legend Story Studios. Card images and names © Legend Story Studios. Card data: <a href="https://github.com/the-fab-cube/flesh-and-blood-cards" target="_blank" rel="noopener">the-fab-cube</a> <span id="commit"></span>. Rarity rates beyond the slot layout are community estimates.</p>
</footer>

<script src="gen.js"></script>
<script src="sfx.js"></script>
<script src="fx.js"></script>
<script src="app.js"></script>
</body>
</html>
