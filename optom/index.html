<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History, Anterior &amp; Posterior Segment Note Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="eye-mark" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M2 17C2 17 8 6 17 6C26 6 32 17 32 17C32 17 26 28 17 28C8 28 2 17 2 17Z" stroke-width="2"/>
      <circle cx="17" cy="17" r="6" stroke-width="2"/>
      <circle cx="17" cy="17" r="2"/>
    </svg>
  </button>
  <div class="title-block">
    <span class="eyebrow">Optometry Charting</span>
    <h1>History, Anterior &amp; Posterior Segment Note Builder</h1>
  </div>
</header>

<nav class="tab-switcher">
  <button type="button" class="chip chip-preset tab-btn is-active" data-type="tab" data-tab="history">History</button>
  <button type="button" class="chip chip-preset tab-btn" data-type="tab" data-tab="anterior">Anterior</button>
  <button type="button" class="chip chip-preset tab-btn" data-type="tab" data-tab="posterior">Posterior</button>
</nav>

<main id="app">

  <div class="tab-panel" data-tab-panel="history">

  <div data-history-groups></div>

  <section class="card" id="section-history-notes">
    <div class="card-head">
      <h2>Additional notes</h2>
    </div>
    <input type="text" class="text-input" id="historyNotesInput" placeholder="e.g. using 3 screens at work">
  </section>

  </div>

  <div class="tab-panel" data-tab-panel="anterior" hidden>

  <section class="card" id="section-lids">
    <div class="card-head">
      <h2>Lids/lashes</h2>
    </div>
    <div class="eyes-grid" data-eyes-grid="lids"></div>
  </section>

  <section class="card" id="section-conj">
    <div class="card-head">
      <h2>Conj</h2>
    </div>
    <div class="eyes-grid" data-eyes-grid="conj"></div>
  </section>

  <section class="card" id="section-cornea">
    <div class="card-head">
      <h2>Cornea</h2>
    </div>
    <div class="preset-row">
      <button type="button" class="chip chip-preset" data-type="cornea" data-value="clear">clear OU</button>
      <button type="button" class="chip chip-preset" data-type="cornea" data-value="arcus">Arcus OU otherwise clear OU</button>
    </div>
    <div class="eyes-grid" data-pterygium-grid></div>
  </section>

  <section class="card" id="section-vh">
    <div class="card-head">
      <h2>VH</h2>
    </div>
    <div class="vh-grid" data-vh-grid></div>
  </section>

  <section class="card" id="section-lens">
    <div class="card-head">
      <h2>Lens</h2>
    </div>
    <div class="eyes-grid" data-eyes-grid="lens"></div>
  </section>

  <section class="card" id="section-irisT">
    <div class="card-head">
      <h2>IrisT</h2>
    </div>
    <div class="preset-row">
      <button type="button" class="chip chip-preset" data-type="single" data-section="irisT">no IrisT OU</button>
    </div>
  </section>

  <section class="card" id="section-ac">
    <div class="card-head">
      <h2>AC</h2>
    </div>
    <div class="preset-row">
      <button type="button" class="chip chip-preset" data-type="single" data-section="ac">AC deep and Q OU</button>
    </div>
  </section>

  </div>

  <div class="tab-panel" data-tab-panel="posterior" hidden>

  <section class="card" id="section-imaging">
    <div class="card-head">
      <h2>Imaging</h2>
    </div>
    <div class="preset-row">
      <button type="button" class="chip chip-preset" data-type="posteriorToggle" data-field="optos">OPTOS</button>
      <button type="button" class="chip chip-preset" data-type="posteriorToggle" data-field="oct">OCT</button>
      <button type="button" class="chip chip-preset" data-type="posteriorToggle" data-field="drs">DRS</button>
    </div>
  </section>

  <section class="card" id="section-vit">
    <div class="card-head">
      <h2>Vitreous</h2>
    </div>
    <div class="eyes-grid" data-post-eyes-grid="vit"></div>
  </section>

  <section class="card" id="section-onh">
    <div class="card-head">
      <h2>ONH</h2>
    </div>
    <div class="eyes-grid" data-onh-grid></div>
  </section>

  <section class="card" id="section-cdr">
    <div class="card-head">
      <h2>CDR</h2>
    </div>
    <div class="vh-grid" data-cdr-grid></div>
  </section>

  <section class="card" id="section-macula">
    <div class="card-head">
      <h2>Macula</h2>
    </div>
    <div class="preset-row">
      <button type="button" class="chip chip-preset" data-type="posteriorToggle" data-field="dimReflex">dim reflex</button>
    </div>
    <div class="eyes-grid" data-post-eyes-grid="macula"></div>
  </section>

  <section class="card" id="section-arcades">
    <div class="card-head">
      <h2>Arcades</h2>
    </div>
    <div class="preset-row">
      <button type="button" class="chip chip-preset" data-type="posteriorToggle" data-field="arcades">arcades clear OU</button>
    </div>
  </section>

  <section class="card" id="section-bv">
    <div class="card-head">
      <h2>BV</h2>
    </div>
    <div class="preset-row">
      <button type="button" class="chip chip-preset" data-type="posteriorToggle" data-field="bv">BV 2:3, non-tort, oblique crossings OU</button>
    </div>
  </section>

  <section class="card" id="section-periphery">
    <div class="card-head">
      <h2>Periphery</h2>
    </div>
    <div class="eyes-grid" data-post-eyes-grid="periphery"></div>
  </section>

  </div>

</main>

<footer>
  <div class="preview-wrap">
    <div class="preview-head">
      <span class="preview-eyebrow" id="previewEyebrow">Anterior note preview</span>
      <div class="preview-actions">
        <button type="button" class="btn-ghost" data-type="reset">Reset to defaults</button>
        <button type="button" class="btn-copy" data-type="copy" id="copyBtn">Copy note</button>
      </div>
    </div>
    <textarea id="preview" rows="3" spellcheck="false" placeholder="Nothing selected yet…"></textarea>
    <span class="preview-hint">Editable — tweak wording here before copying if needed.</span>
  </div>
</footer>

<!-- Plain scripts in dependency order, not modules: module scripts are blocked
     over file://, and this page is opened straight off disk as often as it is
     served. Each file defines one global; app.js reads the other three. -->
<script src="schema.js"></script>
<script src="state.js"></script>
<script src="notes.js"></script>
<script src="app.js"></script>

</body>
</html>
